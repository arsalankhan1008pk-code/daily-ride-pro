<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Daily Ride - Pakistan No.1 Super App</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{background:#f3f4f6}
.header{background:#000;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.logo{font-size:22px;font-weight:800;letter-spacing:-.5px}
.live{background:#00c853;color:#fff;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:800;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.container{max-width:480px;margin:auto;padding-bottom:100px}
.card{background:#fff;margin:12px;border-radius:20px;padding:18px;box-shadow:0 6px 24px rgba(0,0,0,.06);border:1px solid #f0f0f0}
.card-title{font-size:16px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.wallet{background:linear-gradient(135deg,#000 0%,#2a2a2a 100%);color:#fff;border-radius:16px;padding:18px;position:relative;overflow:hidden}
.wallet:before{content:'';position:absolute;right:-20px;top:-20px;width:100px;height:100px;background:rgba(0,200,83,.15);border-radius:50%}
.wallet small{opacity:.6;font-size:11px;letter-spacing:1px}
.wallet h1{font-size:32px;margin:6px 0;font-weight:800}
.wallet .sec{font-size:11px;background:rgba(255,255,255,.1);padding:5px 10px;border-radius:8px;display:inline-flex;gap:5px;align-items:center;margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.stat{background:rgba(255,255,255,.08);padding:10px;border-radius:12px;text-align:center}
.stat b{display:block;font-size:16px}
.stat span{font-size:10px;opacity:.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.input{width:100%;padding:15px 14px;border:1.8px solid #e5e7eb;border-radius:12px;font-size:15px;font-weight:600;background:#fafafa;margin:5px 0;transition:.2s}
.input:focus{border-color:#000;background:#fff;outline:none}
.vehicle{border:2px solid #eee;border-radius:14px;padding:12px;text-align:center;cursor:pointer;transition:.2s}
.vehicle.active{border-color:#000;background:#000;color:#fff}
.vehicle b{display:block;font-size:13px;margin-top:6px}
.vehicle span{font-size:11px;opacity:.7}
.btn{width:100%;padding:16px;border:0;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;transition:.2s}
.btn:active{transform:scale(.97)}
.btn-green{background:#00c853;color:#fff;box-shadow:0 6px 16px rgba(0,200,83,.3)}
.btn-black{background:#000;color:#fff}
.btn-outline{background:#fff;border:2px solid #000;color:#000}
.fare-box{background:#f0fdf4;border:1.5px dashed #00c853;border-radius:12px;padding:12px;text-align:center;margin-top:12px;display:none}
.history-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f3f4f6;font-size:13px}
.badge{padding:4px 8px;border-radius:6px;font-size:10px;font-weight:800}
.badge-ok{background:#e8f5e9;color:#00c853}
.badge-live{background:#000;color:#fff}
.footer-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px 0;z-index:90}
.footer-nav div{text-align:center;font-size:10px;font-weight:700;opacity:.4;cursor:pointer}
.footer-nav div.active{opacity:1}
</style>
</head>
<body>
<div class="header">
<div class="logo">Daily Ride</div>
<div class="live">● UBER SYSTEM ON</div>
</div>

<div class="container">
<!-- OWNER WALLET - SECURED, NO NUMBER -->
<div class="card" style="background:transparent;box-shadow:none;padding:0 12px;border:0">
<div class="wallet">
<small>OWNER COMMISSION WALLET</small>
<h1 id="earnRs">Rs 0</h1>
<div class="sec">🔒 Secured Private Wallet • Owner Only Access</div>
<div class="stats">
<div class="stat"><b id="tRides">0</b><span>TOTAL RIDES</span></div>
<div class="stat"><b>10%</b><span>COMMISSION</span></div>
<div class="stat"><b style="color:#4ade80">LIVE</b><span>STATUS</span></div>
</div>
</div>
</div>

<!-- RIDE BOOKING -->
<div class="card">
<div class="card-title">🏍️ Book Your Ride - Pakistan</div>
<div class="grid2">
<div class="vehicle active" onclick="sel(this,'bike',30)"><div>🏍️</div><b>Bike</b><span>Rs 30/km</span></div>
<div class="vehicle" onclick="sel(this,'rickshaw',45)"><div>🛺</div><b>Rickshaw</b><span>Rs 45/km</span></div>
<div class="vehicle" onclick="sel(this,'car',60)"><div>🚗</div><b>Car</b><span>Rs 60/km</span></div>
<div class="vehicle" onclick="sel(this,'loader',80)"><div>🚚</div><b>Loader</b><span>Rs 80/km</span></div>
</div>
<input id="from" class="input" placeholder="📍 From - e.g Clifton Karachi">
<input id="to" class="input" placeholder="📍 To - e.g Saddar Karachi">
<div class="grid2">
<input id="km" class="input" type="number" placeholder="KM - e.g 5">
<input id="phone" class="input" type="tel" placeholder="Your Phone">
</div>
<button class="btn btn-green" onclick="bookRide()">Book Ride Now - Pay Cash</button>
<div id="fareBox" class="fare-box"></div>
</div>

<!-- DRIVER -->
<div class="card">
<div class="card-title">👨‍✈️ Become Driver - Daily Earning</div>
<input id="dName" class="input" placeholder="Full Name">
<input id="dPhone" class="input" placeholder="Phone Number - e.g 0300...">
<div class="grid2">
<select id="dType" class="input"><option>Bike Rider</option><option>Rickshaw Driver</option><option>Car Driver</option><option>Loader Driver</option
