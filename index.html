<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Ride - Pakistan Super App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system}
body{background:#f0f2f5;color:#111}
.top{background:#000;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99}
.top b{font-size:18px}
.badge{background:#00c853;color:#fff;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:900}
.card{background:#fff;margin:12px;border-radius:20px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.07)}
.card h3{margin-bottom:10px}
input,select{width:100%;padding:14px;border:1.5px solid #e5e7eb;border-radius:12px;margin:6px 0;font-size:15px;outline:none}
input:focus{border-color:#000}
button{width:100%;padding:15px;border:0;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer;background:#000;color:#fff;margin-top:8px}
button:active{transform:scale(.98)}
.g{background:#00c853}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.v{border:2px solid #e5e7eb;padding:14px;border-radius:14px;text-align:center;cursor:pointer;transition:.2s}
.v.on{border-color:#00c853;background:#e8f5e9;transform:scale(1.02)}
.v b{display:block;margin-top:4px}
.wallet{background:#111;color:#fff;padding:14px;border-radius:14px;text-align:center;margin-bottom:12px;border:1px solid #333}
.wallet b{color:#00e676}
.fare-box{background:linear-gradient(135deg,#111,#333);color:#fff;padding:14px;border-radius:14px;text-align:center;display:none;margin:10px 0}
.small{font-size:12px;color:#666;margin-top:6px}
.hr{height:1px;background:#eee;margin:12px 0}
.owner-box{background:#e8f5e9;border:2px dashed #00c853;padding:12px;border-radius:12px}
</style>
</head>
<body>

<div class="top">
<b>Daily Ride 🇵🇰</b>
<span class="badge">UBER SYSTEM ON</span>
</div>

<div class="card">
<div class="wallet">
<div>👑 OWNER COMMISSION WALLET</div>
<b style="font-size:20px">03184014515</b>
<div id="obal" style="margin-top:6px;font-size:18px">Rs
