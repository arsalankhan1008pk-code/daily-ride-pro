<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Ride - All in One Super App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#050505;color:#fff;overflow-x:hidden}
.header{background:linear-gradient(90deg,#00c853,#00e676);padding:16px;text-align:center;font-weight:900;font-size:24px;position:sticky;top:0;z-index:999;box-shadow:0 4px 15px #000}
.subheader{background:#111;padding:8px;text-align:center;color:#888;font-size:12px}
.emer{background:linear-gradient(90deg,#ff0000,#ff3d00);margin:12px;padding:14px;border-radius:14px;text-align:center;font-weight:900;font-size:16px;animation:blink 1s infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0.7}100%{opacity:1}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.grid4{grid-template-columns:1fr 1fr 1fr 1fr}
.card{background:linear-gradient(145deg,#1a1a1a,#222);border:1px solid #333;border-radius:18px;padding:18px;text-align:center;cursor:pointer;transition:0.3s;box-shadow:0 4px 10px #000}
.card:hover{transform:scale(1.05);border-color:#00c853}
.card b{color:#00c853;font-size:15px;display:block;margin-top:6px}
.icon{font-size:32px}
.box{background:linear-gradient(145deg,#161616,#1e1e1e);margin:12px;border-radius:18px;padding:16px;border:1px solid #2a2a2a}
input,select,textarea{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #333;background:#222;color:#fff;font-size:14px}
.btn
